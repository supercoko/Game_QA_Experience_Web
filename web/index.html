<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏 QA 作品集与质量工程看板 · 版本修复分析 × 知识库 × 非侵入自动化</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-badge">QA</div>
          <div>游戏 QA 作品集</div>
        </div>
        <div class="brand-sub">质量工程 × 4,134 修复条目 × 非侵入观测</div>
      </div>

      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-btn active" data-sec="overview">
            <span>1. 能力概览与总览</span>
            <span class="nav-badge">概览</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-sec="online">
            <span>2. 版本修复条目分析</span>
            <span class="nav-badge">4,134</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-sec="methods">
            <span>3. 测试方法与用例库</span>
            <span class="nav-badge">8+14</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-sec="study">
            <span>4. QA 技术知识卡片</span>
            <span class="nav-badge">43 卡</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-sec="autohub">
            <span>5. 非侵入自动化看板</span>
            <span class="nav-badge">CI+原神</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-sec="feedback">
            <span>6. 缺陷记录 & 架构说明</span>
            <span class="nav-badge">Pages</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="mastery-box">
          <div class="mastery-header">
            <span>线上专题自测进度</span>
            <span id="mastery-text">0 / 6 (0%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="mastery-bar" style="width:0%"></div>
          </div>
        </div>
        <div class="mastery-box">
          <div class="mastery-header">
            <span>技术卡片阅读进度</span>
            <span id="fc-progress-text">0 / 43 (0%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="fc-progress-bar" style="width:0%"></div>
          </div>
        </div>
        <div class="sidebar-actions">
          <button class="btn btn-sm" id="theme-toggle" style="flex:1;">☾ 深色</button>
          <button class="btn btn-sm" id="print-btn" style="flex:1;">打印 / PDF</button>
        </div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰ 菜单</button>
          <h1 class="page-title" id="page-title">能力概览与作品集总览</h1>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="search" id="global-search" class="search-input" placeholder="搜索版本修复分析、测试用例、知识卡片、自动化数据..." />
        </div>
      </header>

      <main class="content-area">
        <div id="search-results" style="display:none;"></div>

        <section id="view-overview" class="section-view active"></section>
        <section id="view-online" class="section-view"></section>
        <section id="view-methods" class="section-view"></section>
        <section id="view-study" class="section-view"></section>
        <section id="view-autohub" class="section-view"></section>
        <section id="view-feedback" class="section-view"></section>
      </main>
    </div>
  </div>

  <script>window.QA_APP_MODE = "public";</script>
  <script src="data-public-profile.js"></script>
  <script src="data-online.js"></script>
  <script src="data-methods.js"></script>
  <script src="data-study.js"></script>
  <script src="data-hub.js"></script>
  <script src="app.js"></script>
</body>
</html>
