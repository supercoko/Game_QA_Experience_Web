name: Deploy QA Portfolio & Dashboard to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "web/**"
      - "scripts/configure_pages_supabase.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Optional git ref/SHA to deploy after CI data ingestion"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate real-data-only automation store (Schema v2)
        run: python3 automation/scripts/ci_ingest.py validate --store web/data/automation-runs.json

      - name: Stage public Pages files
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir pages
          rsync -a --exclude='/private/' --exclude='/supabase-schema.sql' web/ pages/
          python3 scripts/configure_pages_supabase.py pages/supabase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web directory artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: "pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
